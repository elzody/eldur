name: Lint

on: [pull_request]

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ruff lint check
        run: nix develop -c uv run ruff check
